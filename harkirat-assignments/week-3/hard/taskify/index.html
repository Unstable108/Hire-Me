<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css" />
</head>
<body>
    <div class="app-header">
        <h1>Taskify</h1>
    </div>

    <div class="todo-list">
        <div class="column">
            <h2>Easy</h2>
            <div class="task-card" draggable="true">Easy 1</div>
            <div class="task-card" draggable="true">Easy 2</div>
            <div class="task-card" draggable="true">Easy 3</div>
        </div>

        <div class="column">
            <h2 >Medium</h2>
            <div class="task-card" draggable="true">Medium 1 </div>
            <div class="task-card" draggable="true">Medium 2</div>
        </div>
        
        <div class="column">
            <h2>Hard</h2>
            <div class="task-card" draggable="true">Hard 1</div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
